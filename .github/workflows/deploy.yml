name: Deploy CSGO SHOP to Namecheap cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Production Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production package
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory was not generated!"
            exit 1
          fi
          echo "dist directory successfully built. Content preview:"
          ls -la dist

      - name: Deploy to Namecheap cPanel via FTPS / FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: ${{ secrets.CPANEL_PORT || 21 }}
          protocol: ${{ secrets.CPANEL_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          log-level: standard
