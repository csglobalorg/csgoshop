<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSGO SHOP | Commerce Control Center</title>
    <!-- Use Tailwind CSS for the Admin Dashboard as requested (modern, dark mode) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex overflow-hidden">
    
    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-gray-800 p-4 border-b border-gray-700 w-full absolute top-0 z-50 shadow-md">
        <h1 class="text-xl font-bold tracking-wider text-white">CSGO <span class="text-blue-500">OS</span></h1>
        <button id="mobileMenuBtn" class="text-gray-300 hover:text-white text-2xl focus:outline-none">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-gray-800 flex flex-col border-r border-gray-700 fixed md:relative z-40 h-full transition-transform transform -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
        <div class="h-16 hidden md:flex items-center px-6 border-b border-gray-700">
            <h1 class="text-xl font-bold tracking-wider text-white">CSGO <span class="text-blue-500">OS</span></h1>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4 mt-16 md:mt-0">
            <ul class="space-y-1">
                <li>
                    <a href="#" class="nav-link active flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="dashboard">
                        <i class="fas fa-home w-5 mr-3"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="products">
                        <i class="fas fa-box w-5 mr-3"></i> Products Hub
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="categories">
                        <i class="fas fa-sitemap w-5 mr-3"></i> Categories
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="orders">
                        <i class="fas fa-shopping-cart w-5 mr-3"></i> Orders
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="users">
                        <i class="fas fa-users w-5 mr-3"></i> Customers
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="affiliates">
                        <i class="fas fa-bullhorn w-5 mr-3"></i> Affiliates
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="finance">
                        <i class="fas fa-chart-line w-5 mr-3"></i> Finance
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="marketing">
                        <i class="fas fa-tags w-5 mr-3"></i> Marketing
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-link flex items-center px-6 py-3 text-gray-300 hover:bg-gray-700 hover:text-white transition" data-target="settings">
                        <i class="fas fa-cog w-5 mr-3"></i> App Config
                    </a>
                </li>
            </ul>
        </nav>
        
        <div class="p-4 border-t border-gray-700 bg-gray-800">
            <div class="flex items-center text-sm">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-blue-400 flex items-center justify-center font-bold mr-3 shadow-lg" id="adminAvatar">A</div>
                <div class="flex-1 truncate">
                    <p class="font-medium text-white truncate" id="adminEmail">Loading...</p>
                    <p class="text-xs text-gray-400" id="adminRole">Admin</p>
                </div>
            </div>
            <button id="logoutBtn" class="mt-4 w-full py-2 text-sm text-center border border-gray-600 rounded hover:bg-gray-700 transition">
                Sign Out
            </button>
            <a href="/" class="block mt-2 w-full py-2 text-sm text-center text-blue-400 hover:text-blue-300 transition">
                Back to Store
            </a>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-900 w-full pt-16 md:pt-0">
        <!-- Topbar -->
        <header class="h-16 hidden md:flex bg-gray-800 border-b border-gray-700 items-center justify-between px-8 shadow-sm">
            <h2 class="text-xl font-semibold text-white" id="pageTitle">Dashboard</h2>
            <div class="flex items-center space-x-4">
                <button class="text-gray-400 hover:text-white relative transition">
                    <i class="fas fa-bell"></i>
                    <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
                    </span>
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative" id="mainContent">
            <!-- Dynamic Content Injected Here -->
            <div id="loadingOverlay" class="flex items-center justify-center h-full">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
            </div>
        </div>
    </main>

    <!-- Authentication Modal (If not logged in or not admin) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-gray-900 bg-opacity-95 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700 transform transition-all">
            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex justify-center items-center shadow-lg">
                    <i class="fas fa-shield-alt text-3xl text-white"></i>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-center text-white mb-2">CSGO Admin Portal</h2>
            <p class="text-center text-gray-400 mb-6 text-sm">Sign in with your staff credentials</p>
            <p class="text-center text-red-400 mb-4 hidden bg-red-900 bg-opacity-20 py-2 rounded" id="authError"></p>
            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Email Address</label>
                    <input type="email" id="adminEmailInput" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-gray-300 text-sm mb-1">Password</label>
                    <input type="password" id="adminPasswordInput" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition transform hover:-translate-y-0.5">
                    Secure Login
                </button>
            </form>
            <a href="/" class="block text-center mt-6 text-gray-400 hover:text-gray-200 text-sm flex items-center justify-center transition">
                <i class="fas fa-arrow-left mr-2"></i> Return to Storefront
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="admin.js"></script>
    <script>
        // Mobile Sidebar Toggle
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (mobileMenuBtn && sidebar && sidebarOverlay) {
                const toggleMenu = () => {
                    sidebar.classList.toggle('-translate-x-full');
                    sidebarOverlay.classList.toggle('hidden');
                };
                
                mobileMenuBtn.addEventListener('click', toggleMenu);
                sidebarOverlay.addEventListener('click', toggleMenu);
                
                // Close sidebar on link click in mobile
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', () => {
                        if(window.innerWidth < 768) {
                            toggleMenu();
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
